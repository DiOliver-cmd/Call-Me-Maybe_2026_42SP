[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained-decoding function calling over Qwen/Qwen3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "dilferre (DiOliver-cmd)" },
]
maintainers = [
    { name = "dilferre" },
]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "llm-sdk",
    "torch>=2.0.0",
]

[project.urls]
GitHub = "https://github.com/DiOliver-cmd/Call-Me-Maybe_2026_42SP"
Intra = "https://profile.intra.42.fr/users/dilferre"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.uv]
# O projeto roda em CPU (modelo 0.6B). O índice abaixo evita baixar as
# bibliotecas CUDA (~2.5 GB) que o wheel padrão do PyTorch arrasta.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repository root importable so `pytest` (and `uv run pytest`) can
# import the `src` package without installing the project.
pythonpath = ["."]
markers = [
    "slow: testes que carregam o modelo real e demoram minutos",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^llm_sdk/", "^GUIAS/"]

# The SDK ships without stubs; treat it as an untyped dependency instead of
# trying to type-check third-party code we are not allowed to modify.
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
